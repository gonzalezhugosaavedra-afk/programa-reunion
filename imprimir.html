<!DOCTYPE html>
<html lang="es" translate="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1b1b1f">
<link rel="icon" href="icons/icono.svg" type="image/svg+xml">
<title>Programa</title>
<!--
  Hoja para imprimir / guardar como PDF. Copia el diseño del Excel original
  (SEPTIEMBRE.xlsm): Calibri (o Carlito, su gemela libre, en Android), título
  en Cambria (o Caladea), barras de sección gris / dorado / burdeo, dos
  semanas por hoja. Tamaño Oficio 8,5 x 13 pulgadas.
-->
<style>
  @font-face { font-family: "Carlito"; font-weight: 400; src: local("Calibri"), url(fonts/carlito-latin-400-normal.woff2) format("woff2"); }
  @font-face { font-family: "Carlito"; font-weight: 700; src: local("Calibri Bold"), local("Calibri-Bold"), url(fonts/carlito-latin-700-normal.woff2) format("woff2"); }
  @font-face { font-family: "Caladea"; font-weight: 700; src: local("Cambria Bold"), local("Cambria-Bold"), url(fonts/caladea-latin-700-normal.woff2) format("woff2"); }

  @page { size: 8.5in 13in; margin: 0.35in 0.3in 0.3in 0.3in; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #fff; color: #000; }
  body { font-family: Calibri, Carlito, "Segoe UI", Arial, sans-serif; font-size: 10.5pt;
         -webkit-print-color-adjust: exact; print-color-adjust: exact; }

  .hoja { height: 12.35in; display: flex; flex-direction: column; page-break-after: always; break-after: page; }
  .hoja:last-child { page-break-after: auto; break-after: auto; }

  .cabecera { display: flex; align-items: flex-end; justify-content: space-between;
              border-bottom: 3px double #575A5D; padding-bottom: 2px; margin-bottom: 2px; }
  .cabecera .cong { font-weight: 700; font-size: 10pt; }
  .cabecera .titulo { font-family: Cambria, Caladea, Georgia, serif; font-weight: 700; font-size: 16.5pt; }

  .semana { flex: 1 1 0; display: flex; flex-direction: column; min-height: 0; }
  .semana + .semana { border-top: 3px double #575A5D; margin-top: 8px; padding-top: 2px; }
  .semana table { width: 100%; border-collapse: collapse; table-layout: fixed; }
  .semana td { padding: 0 3px; height: 17.5pt; vertical-align: middle; white-space: nowrap; overflow: hidden; }
  .c-hora { width: 5.5%; font-size: 8.5pt; font-weight: 700; color: #575A5D; }
  .c-texto { width: 55%; }
  .c-rol { width: 9.5%; text-align: right; font-size: 7.5pt; font-weight: 700; color: #575A5D; }
  .c-nombre { width: 30%; text-align: center; font-size: 11.5pt; }
  .c-texto.largo { font-size: 9.5pt; }
  .c-texto.muy-largo { font-size: 8.5pt; white-space: normal; line-height: 1.05; }
  .min { font-size: 8.5pt; }
  .t-semana td { height: 19pt; }
  .t-semana .c-texto { font-weight: 700; font-size: 10.5pt; }
  .espacio td { height: 9pt; }
  .seccion td.barra { color: #fff; font-weight: 700; font-size: 10pt; letter-spacing: .01em; }
  .seccion.tesoros td.barra { background: #575A5D; }
  .seccion.maestros td.barra { background: #BE8900; }
  .seccion.vida td.barra { background: #7E0024; }
  tr.con-linea td.c-nombre { border-bottom: 1px solid #E0B040; }
  .visita .c-texto { font-weight: 700; }

  .especial { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; min-height: 0; }
  .especial .motivo { font-family: Cambria, Caladea, Georgia, serif; font-size: 15pt; font-weight: 700; text-align: center; }
  .especial img { max-width: 100%; max-height: 100%; object-fit: contain; min-height: 0; flex: 1 1 auto; }
  .especial .sin-imagen { color: #777; font-style: italic; }

  /* ── Solo en pantalla: barra de acciones y hojas a escala ── */
  .barra-acciones { display: none; }
  @media screen {
    body { background: #d9d9d9; padding: 0 0 24px; font-family: Calibri, Carlito, sans-serif; }
    .barra-acciones {
      display: flex; gap: 10px; align-items: center; flex-wrap: wrap; position: sticky; top: 0; z-index: 5;
      padding: 10px 16px; padding-top: max(10px, env(safe-area-inset-top)); background: #1b1b1f; color: #eee;
      font: 14px/1.3 system-ui, sans-serif; box-shadow: 0 2px 8px rgba(0,0,0,.3);
    }
    .barra-acciones .titulo-barra { flex: 1; min-width: 140px; font-weight: 600; }
    .barra-acciones button, .barra-acciones a {
      font: inherit; min-height: 44px; padding: 0 16px; border-radius: 10px; border: 1px solid #444;
      background: transparent; color: #eee; text-decoration: none; display: inline-flex; align-items: center; cursor: pointer;
    }
    .barra-acciones .primario { background: #d9a520; border-color: #d9a520; color: #1b1b1f; font-weight: 600; }
    .ayuda { width: 100%; font-size: 12.5px; color: #bbb; }
    #hojas { padding-top: 16px; }
    .hoja { width: 8.5in; height: 13in; padding: 0.35in 0.3in 0.3in; margin: 0 auto 16px; background: #fff;
            box-shadow: 0 2px 10px rgba(0,0,0,.25); zoom: var(--escala, 1); }
    .mensaje { max-width: 520px; margin: 40px auto; padding: 20px; background: #fff; border-radius: 10px; font: 15px/1.5 system-ui, sans-serif; }
  }
</style>
</head>
<body>
  <div class="barra-acciones">
    <a href="./" id="volver">← Volver</a>
    <span class="titulo-barra" id="titulo-barra">Programa</span>
    <button type="button" class="primario" id="btn-imprimir">Imprimir / Guardar PDF</button>
    <div class="ayuda" id="ayuda">En la ventana de impresión elige «Guardar como PDF» y el tamaño de papel <b>Oficio</b> (8,5 × 13 pulg.) si lo pide.</div>
  </div>
  <div id="hojas"></div>
  <script type="module" src="js/imprimir.js"></script>
</body>
</html>
